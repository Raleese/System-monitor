services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      MONITOR_DATABASE_PATH: /data/metrics.db
      MONITOR_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - metrics-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      MONITOR_SERVER_URL: http://server:8000
      MONITOR_DEVICE_ID_FILE: /data/.device_id
    volumes:
      - agent-id:/data
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metrics-data:
  agent-id: